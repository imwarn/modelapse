name: Publish production images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: modelapse-production-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  guard:
    name: Verify current main
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - name: Reject stale successful CI runs
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$MAIN_SHA" != "$RUN_SHA" ]; then
            echo "Skipping stale CI run $RUN_SHA; current main is $MAIN_SHA"
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image }}
    needs: guard
    if: needs.guard.outputs.current == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/api.Dockerfile
          - image: runner
            dockerfile: docker/runner.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: |
            MODELAPSE_BUILD=${{ github.event.workflow_run.head_sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/modelapse-${{ matrix.image }}:main
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/modelapse-${{ matrix.image }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=modelapse-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=modelapse-${{ matrix.image }}
          provenance: mode=max

  deploy:
    name: Trigger Coolify
    needs: [guard, publish]
    if: needs.guard.outputs.current == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
      COOLIFY_RUNNER_UUID: ${{ secrets.COOLIFY_RUNNER_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Trigger API and runner deployment
        if: env.COOLIFY_URL != '' && env.COOLIFY_API_UUID != '' && env.COOLIFY_RUNNER_UUID != '' && env.COOLIFY_TOKEN != ''
        run: |
          set -euo pipefail
          BASE_URL="${COOLIFY_URL%/}"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 \
            --request POST \
            "${BASE_URL}/api/v1/deploy?uuid=${COOLIFY_API_UUID},${COOLIFY_RUNNER_UUID}" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Accept: application/json"

      - name: Note missing Coolify configuration
        if: env.COOLIFY_URL == '' || env.COOLIFY_API_UUID == '' || env.COOLIFY_RUNNER_UUID == '' || env.COOLIFY_TOKEN == ''
        run: |
          echo "Images were published to GHCR, but Coolify deployment was skipped."
          echo "Configure production environment secrets COOLIFY_URL, COOLIFY_API_UUID,"
          echo "COOLIFY_RUNNER_UUID and COOLIFY_TOKEN to enable automatic deployment."
