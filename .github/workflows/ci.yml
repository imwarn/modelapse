name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: modelapse
          POSTGRES_PASSWORD: modelapse
          POSTGRES_DB: modelapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modelapse -d modelapse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: modelapse
      DATABASE_URL: postgres://modelapse:modelapse@127.0.0.1:5432/modelapse

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate PostgreSQL migrations
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for migration in packages/database/migrations/*.sql; do
            psql -h 127.0.0.1 -U modelapse -d modelapse -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Persistence integration tests
        run: npm run test:integration -w @modelapse/persistence

      - name: OpenAI direct runner integration tests
        run: npm run test:integration -w @modelapse/runner-app

      - name: Build API container
        run: docker build -f docker/api.Dockerfile -t modelapse-api:ci .

      - name: Build runner container
        run: docker build -f docker/runner.Dockerfile -t modelapse-runner:ci .
