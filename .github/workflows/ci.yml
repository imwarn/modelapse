name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: modelapse
          POSTGRES_PASSWORD: modelapse
          POSTGRES_DB: modelapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modelapse -d modelapse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: modelapse

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate PostgreSQL schema
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U modelapse -d modelapse -v ON_ERROR_STOP=1             -f packages/database/migrations/0001_core.sql

      - name: Build API container
        run: docker build -f docker/api.Dockerfile -t modelapse-api:ci .
