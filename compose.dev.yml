services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: modelapse
      POSTGRES_PASSWORD: modelapse
      POSTGRES_DB: modelapse
    ports:
      - "5432:5432"
    volumes:
      - modelapse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelapse -d modelapse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  modelapse-postgres:
